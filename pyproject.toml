[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radiant-prefabdrop"
version = "0.2.0"
description = "Local image-to-brush and image-to-mesh prefabs for CoD4 Radiant"
requires-python = ">=3.11"
dependencies = ["Pillow>=12,<13"]

[project.scripts]
prefabdrop = "prefabdrop.app:main"

[tool.setuptools.packages.find]
where = ["src"]
